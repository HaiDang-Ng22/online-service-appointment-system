    function renderAssocLines() {
      // Connect Guest (60, 240) -> (95, 290)
      const gX = 135, gY = 290;
      const guestLines = [155, 245, 335, 425, 515, 605, 695].map(y => 
        `<line x1="${gX}" y1="${gY}" x2="305" y2="${y}" stroke="#64748b" stroke-width="1.2"/>`
      ).join('');

      // Connect Customer (60, 780) -> (95, 830)
      const cX = 135, cY = 830;
      const custLines = [785, 875, 965, 1055, 1145, 1235, 1325, 1415, 1505].map(y =>
        `<line x1="${cX}" y1="${cY}" x2="305" y2="${y}" stroke="#0284c7" stroke-width="1.2"/>`
      ).join('');

      // Connect Provider (1080, 260) -> (1080, 310)
      const pX = 1070, pY = 310;
      const provLines = [155, 245, 335, 425, 515, 605, 695].map(y =>
        `<line x1="${pX}" y1="${pY}" x2="960" y2="${y}" stroke="#059669" stroke-width="1.2"/>`
      ).join('');

      // Connect Staff (1080, 840) -> (1080, 890)
      const sX = 1070, sY = 890;
      const staffLines = [825, 915, 1005].map(y =>
        `<line x1="${sX}" y1="${sY}" x2="960" y2="${y}" stroke="#d97706" stroke-width="1.2"/>`
      ).join('');

      // Connect Admin (1080, 1260) -> (1080, 1310)
      const aX = 1070, aY = 1310;
      const adminLines = [1135, 1225, 1315, 1405].map(y =>
        `<line x1="${aX}" y1="${aY}" x2="960" y2="${y}" stroke="#7c3aed" stroke-width="1.2"/>`
      ).join('');

      return guestLines + custLines + provLines + staffLines + adminLines;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const container = document.getElementById('svgContainer');
      container.innerHTML = diagrams[tab] || diagrams.all;
    }

    // Init
    document.getElementById('svgContainer').innerHTML = diagrams.all;
